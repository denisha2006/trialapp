{% extends "base.html" %}

{% block title %}Register - AuthVote{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem;">Voter Registration</h2>
        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" name="full_name" id="full_name" class="form-control" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="voter_id">Voter ID Number</label>
                <input type="text" name="voter_id" id="voter_id" class="form-control" required placeholder="VOT123456">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" class="form-control" required placeholder="name@example.com">
            </div>
            <div class="form-row" style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" required placeholder="••••••••">
                </div>
            </div>
            <div class="form-group">
                <label for="role">Register as</label>
                <select name="role" id="role" class="form-control">
                    <option value="voter">Voter</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); text-decoration: none;">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
